<!DOCTYPE html>
<html>
<head>
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; border: 1px solid red; align-items: stretch; }
.left { aspect-ratio: 3/2; background: blue; }
.right { display: flex; flex-direction: column; height: 0; min-height: 100%; background: yellow; }
.content { overflow-y: auto; flex-grow: 1; }
.fixed { height: 50px; background: green; flex-shrink: 0; }
</style>
</head>
<body>
<div class="grid">
  <div class="left"></div>
  <div class="right">
    <div class="content">
       1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>
    </div>
    <div class="fixed"></div>
  </div>
</div>
</body>
</html>
