# Publishes the course to GitHub Pages on every push to the default branch.
#
# The site is plain static files — HTML, ES modules, CSS, and the Assets folder — so
# there is no build step. Everything the learner needs is committed as-is.
#
# dev-server.js is NOT part of the deployed site. It backs Edit Mode (the authoring
# tool) over /api/*, and js/app.js only loads Edit Mode on a localhost origin, so the
# published build never calls it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
